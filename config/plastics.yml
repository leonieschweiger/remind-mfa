# general config
model_class: 'plastics'

# data sources
madrat_output_path: '../../madrat/output'
input_data_path: '../simson_data/data/plastics/output'
input_data_version: 'rev0_h12_d499589e_mfa'

# model customization
model_switches:
  stock_extrapolation_class_name: 'SigmoidExtrapolation'
  regress_over: 'loggdppc_time_weighted_sum'
  lifetime_model_name: 'LogNormalLifetime'
  do_stock_extrapolation_by_category: True
  parameter_extrapolation:
    hist_collection_rate:
      class: LinearToTargetExtrapolation
      target_value: 1.0
      target_year: 2100
    hist_incineration_rate:
      class: LinearToTargetExtrapolation
      target_value: 0.3
      target_year: 2100
    hist_mechanical_recycling_rate:
      class: LinearToTargetExtrapolation
      target_value: 0.4
      target_year: 2100

# visualization
visualization:
  do_visualize: True
  use_stock:
    do_visualize: True
    # options: 'time', 'gdppc'
    # over: 'gdppc'
    over_gdp: True
    acc: True
    per_capita: True
  production:
    do_visualize: True
  extrapolation:
    do_visualize: True
  sankey:
    do_visualize: True
    slice_dict:
      t: 2050
    exclude_processes:
      - "sysenv"
      #- "waste_market"
      #- "primary_market"
      #- "intermediate_market"
      #- "good_market"
    exclude_flows: [ ]
  flows:
    do_visualize: True
  do_show_figs: True
  do_save_figs: False

# data export
output_path: 'data/plastics/output'
do_export:
  pickle: False
  csv: True
  iamc: True
